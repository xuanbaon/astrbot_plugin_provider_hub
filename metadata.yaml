name: provider_hub
display_name: 供应商统一管理
short_desc: 按五类能力扫描核心与所有插件配置里的模型供应商引用，一处修改、一键同步
desc: >-
  解决「改了 AstrBot 主配置的供应商，插件里还指着旧供应商」的问题。
  供应商按 AstrBot 本体的五类能力划分——对话、语音转文字、文字转语音、嵌入、重排序，
  判类规则与本体「模型提供商」面板完全一致（条目声明 → 继承来源 → 兜底对话），
  并会与核心内存里的供应商列表对账；自动扫描 cmd_config.json、
  所有会话配置档（abconf）以及已安装插件的配置，
  列出每一处模型供应商引用（主对话、回退对话模型、上下文压缩、图像理解、插件功能、
  向量嵌入、重排序、语音），在 WebUI 页面里统一改选后一键写回，并自动备份原配置。
  下拉框只列出同一类能力的供应商，跨类误配会被拒绝；
  回退对话模型等数组字段支持多选，顺序即优先级。
  页面提供「重新扫描」按钮，随时按本体最新配置刷新；
  不启动任何常驻监听进程，只在点击同步时工作。
version: 1.3.0
author: xuanbaon
repo: "https://github.com/xuanbaon/astrbot_plugin_provider_hub"
astrbot_version: ">=4.17.0"
