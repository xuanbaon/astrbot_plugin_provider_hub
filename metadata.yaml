name: provider_hub
display_name: 供应商统一管理
short_desc: 按五类能力扫描核心与所有插件配置里的模型供应商引用，一处修改、一键同步
desc: >-
  解决「改了 AstrBot 主配置的供应商，插件里还指着旧供应商」的问题。
  供应商按 AstrBot 本体的五类能力划分——对话、语音转文字、文字转语音、嵌入、重排序，
  判类规则与本体「模型提供商」面板完全一致（条目声明 → 继承来源 → 兜底对话），
  并会与核心内存里的供应商列表对账；自动扫描 cmd_config.json、
  所有会话配置档（abconf）以及已安装插件的配置，
  列出每一处模型供应商引用（主对话、回退对话模型、上下文压缩、图像理解、插件功能、
  向量嵌入、重排序、语音），在 WebUI 页面里统一改选后一键写回，并自动备份原配置。
  下拉框只列出同一类能力的供应商，跨类误配会被拒绝；
  回退对话模型等数组字段用标签编辑器：× 删单项、下拉加项、一键清空，顺序即优先级。
  顶部「配置文件」下拉与本体一致，可在默认配置、各会话配置档、插件配置之间切换后再改；
  其下还有一排配置清单胶囊，把扫描到的每个范围连同引用处数一次列出（刚建好、还没配
  供应商的配置档也会出现），点一下即筛选。
  「复制配置…」能把一个配置里的供应商设置整体复制到另一个配置（例如把默认配置的
  一套模型搬到某个会话配置档），只动供应商字段、复制前自动备份目标。
  「撤回上一步」用写前快照整份还原，复制/同步选错配置也能一键退回，可连续撤回多步；
  撤多了点「恢复」退回来（Ctrl+Z / Ctrl+Y），两个方向能来回切，
  新的同步会清空可恢复的记录。
  分组标题可点击收起/展开（另有全部收起、全部展开），配置档与插件配置多的时候
  不用来回滚动。
  页面提供「重新扫描」按钮，随时按本体最新配置刷新；
  不启动任何常驻监听进程，只在点击同步、复制或撤回时工作。
